name: BARAR SALAT TIME Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android app module from app.zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app /tmp/app-archive
          unzip -q -o app.zip -d /tmp/app-archive
          APP_BUILD_FILE="$(find /tmp/app-archive -type f -name build.gradle -print -quit)"
          if [ -z "$APP_BUILD_FILE" ]; then
            echo "Could not find app module build.gradle inside app.zip"
            find /tmp/app-archive -maxdepth 5 -type f | sort
            exit 1
          fi
          APP_MODULE_DIR="$(dirname "$APP_BUILD_FILE")"
          if [ ! -f "$APP_MODULE_DIR/src/main/AndroidManifest.xml" ]; then
            echo "AndroidManifest.xml not found beside the app module build.gradle"
            find /tmp/app-archive -maxdepth 7 -type f | sort
            exit 1
          fi
          cp -a "$APP_MODULE_DIR"/. app/
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BARAR-SALAT-TIME-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
