
name: BARAR SALAT TIME Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install SDK Packages
      - name: Install Android SDK Packages
        run: |
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Restore App from ZIP
      - name: Restore Android app module
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f app.zip ]; then
            echo "ERROR: app.zip not found in repository root"
            exit 1
          fi

          mkdir -p /tmp/android-app

          unzip -q -o app.zip -d /tmp/android-app

          APP_BUILD_FILE=$(find /tmp/android-app -type f -name build.gradle -print -quit)

          if [ -z "$APP_BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle not found inside app.zip"
            exit 1
          fi

          APP_DIR=$(dirname "$APP_BUILD_FILE")

          if [ ! -f "$APP_DIR/src/main/AndroidManifest.xml" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

          mkdir -p app
          cp -a "$APP_DIR"/. app/

          echo "Android app module restored successfully"

          ls -la app

      # 6. Verify Project Files
      - name: Verify Android project
        run: |
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Project verification successful"

      # 7. Setup Gradle
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 8. Build APK
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --no-daemon

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BARAR-SALAT-TIME-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
