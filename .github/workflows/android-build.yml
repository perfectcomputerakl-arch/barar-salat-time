name: BARAR SALAT TIME Android Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Android app module
        run: |
          mkdir -p app
          unzip -o app.zip -d app
          test -f app/src/main/AndroidManifest.xml
          test -f app/build.gradle

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BARAR-SALAT-TIME-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
